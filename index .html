function finish(){const ok=ans.map((a,i)=>a==Q[i][3]),sc=ok.filter(Boolean).length,tot=(Date.now()-t0)/1000,p=sc/Q.length*100;

try{const d=load();d.push(r);localStorage.setItem(dbk,JSON.stringify(d))}catch(e){}
$("v-quiz").classList.add("hide");$("v-res").classList.remove("hide");$("v-res").innerHTML=dash(r);LAST=r;if(r.sc==Q.length)fx()}

T([[140,2],[0,245],[284,245]],"#c9c9cc");T([[140,2],[422,2],[284,245]],"#c4161f");T([[0,245],[284,245],[147,485]],"#c4161f");T([[284,245],[425,485],[147,485]],"#c9c9cc");
